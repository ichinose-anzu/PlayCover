name: Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install carthage
          carthage update --use-xcframeworks

      - name: Debug carthage log
        if: failure()
        run: |
          LOG=$(find /var/folders -name "carthage-xcodebuild.*.log" 2>/dev/null | head -1)
          echo "=== LOG: $LOG ==="
          [ -n "$LOG" ] && grep -E "error:|The following build commands failed|Exit code|fatal error" "$LOG" | head -20
          echo "=== TAIL 40 ==="
          [ -n "$LOG" ] && tail -40 "$LOG"

      - name: Build
        run: |
          xcodebuild -scheme PlayCover \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlayCover
          path: build/Build/Products/Release/PlayCover.app
